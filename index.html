<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Build Foundry</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --orange: #FF6B00;
            --white: #FFFFFF;
            --gray-light: #F4F4F4;
            --gray-dark: #333333;
            --gray-hint: #AAAAAA;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--white);
            color: var(--gray-dark);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: crosshair;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            pointer-events: none;
            padding: 0 20px;
            /* Prevents text hitting screen edges */
        }

        h1 {
            font-size: clamp(1.8rem, 8vw, 3.5rem);
            font-weight: 300;
            letter-spacing: -1px;
            margin: 0;
            line-height: 1.2;
        }

        .credit {
            font-size: 1rem;
            color: var(--gray-hint);
            margin-top: 15px;
            letter-spacing: 1px;
            font-weight: 400;
        }

        .highlight {
            color: var(--orange);
            font-weight: 700;
        }

        .footer {
            position: absolute;
            bottom: 40px;
            z-index: 2;
            text-align: center;
            width: 100%;
            pointer-events: all;
        }

        .contact-link {
            color: var(--gray-dark);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.3s ease;
            display: inline-block;
            padding: 10px;
            /* Larger hit area for thumbs */
        }

        .contact-link:hover {
            color: var(--orange);
        }

        .hint {
            margin-top: 10px;
            font-size: 0.65rem;
            color: var(--gray-hint);
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: breathe 3s infinite ease-in-out;
            pointer-events: none;
        }

        /* --- MOBILE ADJUSTMENTS --- */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
                letter-spacing: -0.5px;
            }

            .credit {
                font-size: 0.85rem;
                margin-top: 8px;
            }

            .footer {
                bottom: 30px;
            }

            .contact-link {
                font-size: 0.8rem;
            }
        }

        @keyframes breathe {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.8;
            }
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <div class="content">
        <h1>Something <span class="highlight">amazing</span> is under construction.</h1>
        <div class="credit">by Vishesh Chhabra</div>
    </div>

    <div class="footer">
        <a href="mailto:info@thebuildfoundry.com" class="contact-link">info@thebuildfoundry.com</a>
        <div class="hint">Interact with the space</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Clear and restart particles on resize to avoid weird stretching
            createInitialParticles();
        }

        class Particle {
            constructor(x, y, isBurst = false) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                // Faster bursts for mobile tactile feel
                this.speedX = isBurst ? (Math.random() - 0.5) * 8 : (Math.random() - 0.5) * 1.5;
                this.speedY = isBurst ? (Math.random() - 0.5) * 8 : (Math.random() - 0.5) * 1.5;
                this.color = Math.random() > 0.3 ? '#FF6B00' : '#DDDDDD';
                this.life = 100;
                this.isBurst = isBurst;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.isBurst) this.life -= 2;

                if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
            }
            draw() {
                ctx.globalAlpha = this.isBurst ? this.life / 100 : 0.6;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createInitialParticles() {
            particles = [];
            const count = window.innerWidth < 600 ? 40 : 80; // Fewer particles on mobile for performance
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function handleInteract(e) {
            if (e.target.tagName === 'A') return;

            // Fix for multi-touch or mouse
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            if (clientX && clientY) {
                for (let i = 0; i < 10; i++) {
                    particles.push(new Particle(clientX, clientY, true));
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => !p.isBurst || p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', initCanvas);
        window.addEventListener('mousedown', handleInteract);
        window.addEventListener('touchstart', (e) => {
            handleInteract(e);
            // Prevent scrolling behavior while interacting with the fidget
            if (e.target.tagName !== 'A') e.preventDefault();
        }, { passive: false });

        initCanvas();
        animate();
    </script>
</body>

</html>
