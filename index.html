<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        :root {
            --orange: #FF6B00;
            --white: #FFFFFF;
            --gray-light: #F4F4F4;
            --gray-dark: #333333;
            --gray-hint: #AAAAAA;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--white);
            color: var(--gray-dark);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: crosshair;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            pointer-events: none;
            /* Allows clicks to pass through to the canvas */
        }

        h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 300;
            letter-spacing: -1px;
            margin: 0;
        }

        .highlight {
            color: var(--orange);
            font-weight: 700;
        }

        .hint {
            position: absolute;
            bottom: 40px;
            font-size: 0.75rem;
            color: var(--gray-hint);
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: breathe 3s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes breathe {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.8;
            }
        }
    </style>
</head>

<body>

    <canvas id="canvas"></canvas>

    <div class="content">
        <h1>Something <span class="highlight">amazing</span> is under construction.</h1>
    </div>

    <div class="hint">Interact with the space</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor(x, y, isBurst = false) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = isBurst ? (Math.random() - 0.5) * 6 : (Math.random() - 0.5) * 1;
                this.speedY = isBurst ? (Math.random() - 0.5) * 6 : (Math.random() - 0.5) * 1;
                this.color = Math.random() > 0.3 ? '#FF6B00' : '#DDDDDD';
                this.life = 100;
                this.isBurst = isBurst;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.isBurst) this.life -= 1.5;

                if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
            }
            draw() {
                ctx.globalAlpha = this.isBurst ? this.life / 100 : 0.6;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createInitialParticles() {
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle());
            }
        }

        function handleInteract(e) {
            const x = e.clientX || e.touches[0].clientX;
            const y = e.clientY || e.touches[0].clientY;
            // Add burst particles on click/tap
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(x, y, true));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => !p.isBurst || p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', initCanvas);
        window.addEventListener('mousedown', handleInteract);
        window.addEventListener('touchstart', (e) => handleInteract(e.touches[0]));

        initCanvas();
        createInitialParticles();
        animate();
    </script>
</body>

</html>
