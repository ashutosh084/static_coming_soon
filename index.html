<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Build Foundry</title>
    <meta name="title" content="The Build Foundry | Premium Custom PC Building">
    <meta name="description"
        content="Something amazing is under construction. Custom high-end PC builds by Vishesh Chhabra.">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --orange: #FF6B00;
            --white: #FFFFFF;
            --gray-light: #F4F4F4;
            --gray-dark: #333333;
            --gray-hint: #AAAAAA;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--white);
            color: var(--gray-dark);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: crosshair;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            pointer-events: none;
            padding: 0 20px;
            width: 100%;
            max-width: 600px;
            /* Prevents the footer from jumping when content loads */
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: clamp(1.8rem, 8vw, 3.5rem);
            font-weight: 300;
            letter-spacing: -1px;
            margin: 0;
            line-height: 1.2;
        }

        .highlight {
            color: var(--orange);
            font-weight: 700;
        }

        /* --- LOADING BAR STYLES --- */
        /* --- STABILIZED LOADING BAR STYLES --- */
        .progress-container {
            margin-top: 40px;
            width: 100%;
            background: var(--gray-light);
            height: 4px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: var(--orange);
            width: 0%;
            transition: width 2.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px rgba(255, 107, 0, 0.3);
        }

        .progress-status-container {
            margin-top: 15px;
            height: 20px;
            /* Fixed height prevents layout shifting */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .progress-text {
            font-size: 0.85rem;
            font-weight: 200;
            color: var(--orange);
            letter-spacing: 1px;
            /* text-transform: uppercase; */
            font-variant-numeric: tabular-nums;
            /* Keeps numbers steady */
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .progress-text.visible {
            opacity: 1;
        }

        .credit {
            font-size: 1rem;
            color: var(--gray-hint);
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .footer {
            position: absolute;
            bottom: 40px;
            z-index: 2;
            text-align: center;
            width: 100%;
            pointer-events: all;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .social-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .contact-link,
        .insta-link {
            color: var(--gray-dark);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .insta-link svg {
            width: 20px;
            height: 20px;
            fill: var(--gray-dark);
            transition: fill 0.3s ease;
        }

        .contact-link:hover,
        .insta-link:hover {
            color: var(--orange);
        }

        .insta-link:hover svg {
            fill: var(--orange);
        }

        .hint {
            font-size: 0.65rem;
            color: var(--gray-hint);
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: breathe 3s infinite ease-in-out;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }

            .social-links {
                flex-direction: column;
                gap: 10px;
            }
        }

        @keyframes breathe {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.8;
            }
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>

    <div class="content">
        <h1>Something <span class="highlight">amazing</span> is under construction.</h1>
        <div class="credit">by Vishesh Chhabra</div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-status-container">
            <div class="progress-text" id="progressText">Initiating Forge...</div>
        </div>
    </div>

    <div class="footer">
        <div class="social-links">
            <a href="mailto:info@thebuildfoundry.com" class="contact-link">info@thebuildfoundry.com</a>
            <a href="https://www.instagram.com/thebuildfoundry/" target="_blank" class="insta-link">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.058-1.69-.072-4.949-.072zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" />
                </svg>
                @thebuildfoundry
            </a>
        </div>
        <div class="hint">Interact with the space</div>
    </div>

    <script>
        function getBuildStep(progress) {
            const steps = [
                { threshold: 0, text: "Sourcing high-end components" },
                { threshold: 10, text: "Unboxing the chassis" },
                { threshold: 20, text: "Mounting the motherboard" },
                { threshold: 30, text: "Seating the CPU" },
                { threshold: 40, text: "Applying thermal paste" },
                { threshold: 50, text: "Installing memory modules" },
                { threshold: 60, text: "Routing power cables" },
                { threshold: 70, text: "Mounting the RTX 4080" },
                { threshold: 80, text: "Optimizing airflow & cooling" },
                { threshold: 90, text: "Final BIOS tuning" },
                { threshold: 98, text: "Polishing the tempered glass" }
            ];
            const currentStep = [...steps].reverse().find(step => progress >= step.threshold);
            return currentStep ? currentStep.text : "Initiating Forge";
        }

        function updateProgressBar() {
            const now = new Date();
            const totalDays = 21;
            const launchDate = new Date("2026-02-05T00:00:00");

            const diffInDays = (now - launchDate) / (1000 * 60 * 60 * 24);
            const progress = Math.min(Math.max((diffInDays / totalDays) * 100, 0), 100);
            const displayProgress = progress.toFixed(0);

            const bar = document.getElementById('progressBar');
            const textElement = document.getElementById('progressText');

            // 1. Start the bar animation
            setTimeout(() => {
                bar.style.width = displayProgress + "%";
            }, 100);

            // 2. Smoothly fade in the text after a short delay
            setTimeout(() => {
                textElement.innerText = `${getBuildStep(displayProgress)}: ${displayProgress}%`;
                textElement.classList.add('visible');
            }, 800);
        }

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            createInitialParticles();
        }

        class Particle {
            constructor(x, y, isBurst = false) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = isBurst ? (Math.random() - 0.5) * 8 : (Math.random() - 0.5) * 1.5;
                this.speedY = isBurst ? (Math.random() - 0.5) * 8 : (Math.random() - 0.5) * 1.5;
                this.color = Math.random() > 0.3 ? '#FF6B00' : '#DDDDDD';
                this.life = 100;
                this.isBurst = isBurst;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.isBurst) this.life -= 2;
                if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
            }
            draw() {
                ctx.globalAlpha = this.isBurst ? this.life / 100 : 0.6;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createInitialParticles() {
            particles = [];
            const count = window.innerWidth < 600 ? 40 : 80;
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }

        function handleInteract(e) {
            if (e.target.closest('a')) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            if (clientX && clientY) {
                for (let i = 0; i < 10; i++) particles.push(new Particle(clientX, clientY, true));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => !p.isBurst || p.life > 0);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', initCanvas);
        window.addEventListener('mousedown', handleInteract);
        window.addEventListener('touchstart', (e) => {
            if (!e.target.closest('a')) e.preventDefault();
            handleInteract(e);
        }, { passive: false });

        initCanvas();
        animate();
        updateProgressBar();
    </script>
</body>

</html>
